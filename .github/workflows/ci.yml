name: CI & Deployment Quality Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Typecheck, Security, Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Analysis
        run: npm run typecheck

      - name: Security Secrets Scan
        run: npm run security:scan

      - name: Zero-Knowledge Operation History Tests
        run: npm run test:history

      - name: Agent Chat & Magic Link Flow Tests
        run: npm run test:agent-chat

      - name: WebMCP Client Conformance Tests
        run: npm run test:webmcp:conformance

      - name: Protocol & Payment Flow Tests
        run: npm run test:payment-flow

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
